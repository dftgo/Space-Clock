<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שעון מערכת השמש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Heebo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #eaf2ff;
    --muted: #9fb3d9;
    --accent: #7fd4ff;
    --glow: rgba(127, 212, 255, 0.55);
    --panel: rgba(10, 16, 40, 0.05);
    --border: rgba(160, 200, 255, 0.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #02030a;
    color: var(--text);
    font-family: 'Heebo', system-ui, sans-serif;
  }
  canvas { position: fixed; inset: 0; display: block; }

  .clock {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    max-width: 92vw;
    padding: 14px 32px;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: inset 0 0 30px rgba(127, 212, 255, 0.05);
    opacity: 0.62;
    user-select: none;
    pointer-events: none;
    white-space: nowrap;
  }
  .clock.top    { top: 3vh; }
  .clock.bottom { bottom: 4vh; }
  .time {
    direction: ltr;
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: clamp(2.6rem, 11vw, 5.4rem);
    letter-spacing: 0.04em;
    line-height: 1;
    text-shadow: 0 0 18px var(--glow), 0 0 42px rgba(127, 212, 255, 0.25);
    font-variant-numeric: tabular-nums;
  }
  .time .sec {
    font-size: 0.45em;
    color: var(--accent);
    margin-inline-start: 0.15em;
  }
  .time .colon { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }

  .date {
    font-size: clamp(1.05rem, 3.6vw, 1.45rem);
    font-weight: 400;
  }
  .title {
    position: fixed;
    top: 18px;
    right: 22px;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    opacity: 0.8;
  }
</style>
</head>
<body>
  <canvas id="space"></canvas>

  <div class="title">✦ מערכת השמש</div>

  <div class="clock top" role="timer" aria-live="off">
    <div class="time" id="time"></div>
  </div>
  <div class="clock bottom">
    <div class="date" id="date"></div>
  </div>

<script>
/* ---------- Clock ---------- */
const timeEl = document.getElementById('time');
const dateEl = document.getElementById('date');

const dateFmt = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

const pad = n => String(n).padStart(2, '0');
function updateClock() {
  const now = new Date();
  timeEl.innerHTML =
    `${pad(now.getHours())}<span class="colon">:</span>${pad(now.getMinutes())}<span class="sec">${pad(now.getSeconds())}</span>`;
  dateEl.textContent = dateFmt.format(now);
}
updateClock();
setInterval(updateClock, 1000);

/* ---------- Space scene ---------- */
const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, scale, dpr;

const planets = [
  // inc = tilt of the orbital plane, node = direction of that tilt (degrees, exaggerated for effect)
  { name: 'כוכב חמה',  r: 2.6, dist: 0.13, period: 8,   inc: 28,  node: 20,  color: ['#d8c8b0', '#8a7a68'] },
  { name: 'נוגה',      r: 4.2, dist: 0.19, period: 14,  inc: -16, node: 110, color: ['#f5deb0', '#b68a4a'] },
  { name: 'כדור הארץ', r: 4.5, dist: 0.26, period: 22,  inc: 0,   node: 0,   color: ['#7fc8ff', '#1e5aa8'], moon: true },
  { name: 'מאדים',     r: 3.4, dist: 0.33, period: 34,  inc: 22,  node: 200, color: ['#ff9a6a', '#a8401e'] },
  { name: 'צדק',       r: 10,  dist: 0.47, period: 70,  inc: -12, node: 60,  color: ['#f0d2a8', '#a87850'], bands: true },
  { name: 'שבתאי',     r: 8.5, dist: 0.62, period: 110, inc: 18,  node: 150, color: ['#f6e3b4', '#b89a5e'], ring: true },
  { name: 'אורנוס',    r: 6,   dist: 0.76, period: 170, inc: -25, node: 260, color: ['#b8f2f2', '#4aa4b0'] },
  { name: 'נפטון',     r: 5.8, dist: 0.89, period: 240, inc: 32,  node: 320, color: ['#8fb0ff', '#2a44b8'] },
];
const DEG = Math.PI / 180;
planets.forEach(p => {
  p.phase = Math.random() * Math.PI * 2;
  p.sinI = Math.sin(p.inc * DEG); p.cosI = Math.cos(p.inc * DEG);
  p.sinN = Math.sin(p.node * DEG); p.cosN = Math.cos(p.node * DEG);
});

const PITCH = 0.45;      // camera looks down on the system at this angle (radians)
const YAW_SPEED = 0.00003; // whole system slowly turns so the different planes are visible
let yaw = 0;
let stars = [], shooting = [], nebulae = [];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  scale = Math.min(W * 0.62, H * 1.15);

  const count = Math.round((W * H) / 2200);
  stars = Array.from({ length: count }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    z: Math.random() * 0.9 + 0.1,          // depth -> speed & size
    tw: Math.random() * Math.PI * 2,
    hue: [210, 220, 45, 0, 200][Math.floor(Math.random() * 5)],
  }));
  nebulae = Array.from({ length: 4 }, (_, i) => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.max(W, H) * (0.25 + Math.random() * 0.25),
    hue: [260, 200, 320, 230][i],
  }));
}
window.addEventListener('resize', resize);
resize();

function drawBackground(t) {
  ctx.fillStyle = '#02030a';
  ctx.fillRect(0, 0, W, H);
  nebulae.forEach((n, i) => {
    const ox = Math.sin(t * 0.00003 + i) * 40;
    const g = ctx.createRadialGradient(n.x + ox, n.y, 0, n.x + ox, n.y, n.r);
    g.addColorStop(0, `hsla(${n.hue}, 70%, 35%, 0.13)`);
    g.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  });
}

function drawStars(t, dt) {
  for (const s of stars) {
    // slow drift to the left, parallax by depth
    s.x -= s.z * 0.012 * dt;
    s.y += s.z * 0.003 * dt;
    if (s.x < -2) { s.x = W + 2; s.y = Math.random() * H; }
    if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; }
    const a = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.0015 * s.z + s.tw));
    const size = s.z * 2.4;
    ctx.fillStyle = `hsla(${s.hue}, ${s.hue === 0 ? 0 : 70}%, 88%, ${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  // shooting stars
  if (Math.random() < 0.004 * (dt / 16)) {
    shooting.push({
      x: Math.random() * W * 0.8 + W * 0.2, y: Math.random() * H * 0.4,
      vx: -(6 + Math.random() * 6), vy: 2 + Math.random() * 3, life: 1,
    });
  }
  shooting = shooting.filter(s => s.life > 0);
  for (const s of shooting) {
    s.x += s.vx * dt / 16; s.y += s.vy * dt / 16; s.life -= 0.012 * dt / 16;
    const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 12, s.y - s.vy * 12);
    g.addColorStop(0, `rgba(255,255,255,${s.life})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 12, s.y - s.vy * 12); ctx.stroke();
  }
}

function drawSun(t) {
  const R = Math.max(18, scale * 0.055);
  const pulse = 1 + Math.sin(t * 0.002) * 0.04;
  const corona = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 4.5 * pulse);
  corona.addColorStop(0, 'rgba(255, 200, 80, 0.55)');
  corona.addColorStop(0.4, 'rgba(255, 120, 30, 0.15)');
  corona.addColorStop(1, 'rgba(255, 80, 0, 0)');
  ctx.fillStyle = corona;
  ctx.beginPath(); ctx.arc(cx, cy, R * 4.5 * pulse, 0, Math.PI * 2); ctx.fill();

  const body = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
  body.addColorStop(0, '#fffbe0');
  body.addColorStop(0.5, '#ffd040');
  body.addColorStop(1, '#ff8a00');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
}

// Point on planet p's orbit at angle a, projected to the screen.
// Orbit lies in its own plane: tilted by p.inc around the x axis, then turned by p.node around the vertical axis.
function orbitPoint(p, a) {
  const r = p.dist * scale;
  const x0 = Math.cos(a) * r, z0 = Math.sin(a) * r;
  const y1 = -z0 * p.sinI, z1 = z0 * p.cosI;
  const x2 = x0 * p.cosN - z1 * p.sinN, z2 = x0 * p.sinN + z1 * p.cosN;
  return project(x2, y1, z2);
}

// World (y up) -> screen, with the camera turning (yaw) and looking down (pitch), plus mild perspective.
function project(x, y, z) {
  const cyw = Math.cos(yaw), syw = Math.sin(yaw);
  const x1 = x * cyw - z * syw, z1 = x * syw + z * cyw;
  const cp = Math.cos(PITCH), sp = Math.sin(PITCH);
  const y2 = y * cp + z1 * sp;      // far side appears higher
  const depth = z1 * cp - y * sp;   // positive = away from viewer
  const D = scale * 2.6;
  const f = D / (D + depth);
  return { x: cx + x1 * f, y: cy - y2 * f, depth, f };
}

function planetPos(p, t) {
  const a = p.phase + (t / 1000) * (Math.PI * 2 / p.period);
  return orbitPoint(p, a);
}

function drawOrbit(p) {
  ctx.strokeStyle = 'rgba(150, 180, 255, 0.16)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const N = 140;
  for (let i = 0; i <= N; i++) {
    const pt = orbitPoint(p, (i / N) * Math.PI * 2);
    i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y);
  }
  ctx.stroke();
}

function drawPlanet(p, pos, t) {
  const k = scale / 500;
  const r = Math.max(2.5, p.r * 1.7 * k * pos.f);   // nearer = bigger
  const { x, y } = pos;

  if (p.ring) drawRing(x, y, r, true);

  // lit side faces the sun
  const ang = Math.atan2(cy - y, cx - x);
  const lx = x + Math.cos(ang) * r * 0.45, ly = y + Math.sin(ang) * r * 0.45;
  const g = ctx.createRadialGradient(lx, ly, r * 0.1, x, y, r * 1.1);
  g.addColorStop(0, p.color[0]);
  g.addColorStop(0.7, p.color[1]);
  g.addColorStop(1, '#05060f');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

  if (p.bands) {
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#7a4a2a';
    for (let i = -2; i <= 2; i++) ctx.fillRect(x - r, y + i * r * 0.35 - r * 0.07, r * 2, r * 0.13);
    ctx.restore();
  }

  if (p.ring) drawRing(x, y, r, false);

  if (p.moon) {
    const ma = t * 0.0035;
    const mx = x + Math.cos(ma) * r * 2.6, my = y + Math.sin(ma) * r * 2.6 * 0.5;
    ctx.fillStyle = '#cfd3dc';
    ctx.beginPath(); ctx.arc(mx, my, Math.max(1, r * 0.3), 0, Math.PI * 2); ctx.fill();
  }
}

function drawRing(x, y, r, back) {
  ctx.save();
  ctx.strokeStyle = 'rgba(230, 210, 160, 0.65)';
  ctx.lineWidth = Math.max(1, r * 0.35);
  ctx.beginPath();
  // back half drawn before planet, front half after
  ctx.ellipse(x, y, r * 2.1, r * 0.6, -0.25, back ? Math.PI : 0, back ? Math.PI * 2 : Math.PI);
  ctx.stroke();
  ctx.restore();
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(50, t - last); last = t;
  drawBackground(t);
  drawStars(t, dt);

  yaw = t * YAW_SPEED;
  planets.forEach(drawOrbit);
  // draw far-to-near so planets pass correctly in front of / behind the sun
  const bodies = planets.map(p => ({ p, pos: planetPos(p, t) }));
  bodies.push({ sun: true, pos: { depth: 0 } });
  bodies.sort((a, b) => b.pos.depth - a.pos.depth)
        .forEach(o => o.sun ? drawSun(t) : drawPlanet(o.p, o.pos, t));

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
